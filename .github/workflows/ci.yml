name: CI

# Runs on every push and pull request. A release is a separate workflow
# (release.yml) triggered by a version tag.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks that need no compiler for whisper.cpp: formatting, the
  # version being the same everywhere, workflow syntax and JS syntax.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Versions agree
        run: node scripts/version.mjs --check
      - name: JavaScript syntax
        run: for f in ui/*.js scripts/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Workflow syntax
        uses: raven-actions/actionlint@v2

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: UI tests
        run: npm run test:ui -- ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # Real bugs fail the build; style lints are reported but do not.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: agent-desk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/agent-desk.exe
          if-no-files-found: error
