name: Release

# Push a tag like v0.2.0 (see "Releasing" in CONTRIBUTING.md) to build the
# Windows installer and portable zip, publish a GitHub Release, and update
# the package managers:
#
#   Scoop       always: bucket/agent-desk.json in this repo is updated.
#   winget      when the repo variable PUBLISH_WINGET is "true" and the
#               secret WINGET_TOKEN is set (classic PAT, public_repo scope).
#   Chocolatey  when the repo variable PUBLISH_CHOCOLATEY is "true" and the
#               secret CHOCOLATEY_API_KEY is set.
#
# Pre-release tags (v1.2.3-beta.1) only publish the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # whisper.cpp's CMake cache stores the full MSVC path, which changes
      # when GitHub updates the runner image, so the image is in the key.
      - name: Runner image version
        shell: bash
        run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ env.IMAGE_VERSION }}
      - run: npm ci

      - name: Check the tag matches the version files
        id: meta
        shell: bash
        run: |
          node scripts/version.mjs --check "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # With the signing key (repository secret TAURI_SIGNING_PRIVATE_KEY)
      # the installer is signed and the in-app updater can install it.
      # Without it the release still works, just without in-app updates.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this release will not update itself in the app."
            npx tauri build
          fi

      - name: Collect release files
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "No NSIS installer was built." }
          Copy-Item $setup.FullName "dist/Agent-Desk_${env:VERSION}_x64-setup.exe"
          if (Test-Path "$($setup.FullName).sig") {
            Copy-Item "$($setup.FullName).sig" "dist/Agent-Desk_${env:VERSION}_x64-setup.exe.sig"
          }
          Compress-Archive -Path src-tauri/target/release/agent-desk.exe, LICENSE, README.md `
            -DestinationPath "dist/Agent-Desk_${env:VERSION}_x64-portable.zip"
          node scripts/version.mjs --notes $env:VERSION | Out-File -Encoding utf8 dist/NOTES.md
          node scripts/packaging.mjs $env:VERSION dist
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Agent Desk $VERSION" --verify-tag)
          if [ -s dist/NOTES.md ] && grep -q '[^[:space:]]' dist/NOTES.md; then
            args+=(--notes-file dist/NOTES.md)
          else
            args+=(--generate-notes)
          fi
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          files=(dist/*.exe dist/*.zip dist/SHA256SUMS.txt)
          # The in-app updater reads latest.json from the latest release.
          [ -f dist/latest.json ] && files+=(dist/latest.json dist/*.sig)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi

  scoop:
    needs: [build, github-release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Update the Scoop bucket
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p bucket
          cp dist/packaging/scoop/agent-desk.json bucket/agent-desk.json
          if git diff --quiet --exit-code -- bucket && git ls-files --error-unmatch bucket/agent-desk.json >/dev/null 2>&1; then
            echo "Scoop manifest already up to date."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/agent-desk.json
          git commit -m "Scoop: agent-desk $VERSION"
          git push

  winget:
    needs: [build, github-release]
    if: needs.build.outputs.prerelease == 'false' && vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    steps:
      # Opens a pull request on microsoft/winget-pkgs from a fork owned by
      # the token's account. The very first version must be submitted by
      # hand (see packaging/README.md); after that this keeps it current.
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Kedhareswer.AgentDesk
          version: ${{ needs.build.outputs.version }}
          release-tag: ${{ env.TAG }}
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    needs: [build, github-release]
    if: needs.build.outputs.prerelease == 'false' && vars.PUBLISH_CHOCOLATEY == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Pack and push
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          cd dist/packaging/chocolatey
          choco pack agent-desk.nuspec
          choco push (Get-ChildItem *.nupkg).Name --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
