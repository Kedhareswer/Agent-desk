[package]
name = "agent-desk"
version = "0.1.5"
description = "A lightweight background AI assistant that reuses your Claude or Codex subscription"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
arboard = { version = "3", default-features = false }
which = "8"
whisper-rs = "0.16"
cpal = "0.18"
tauri-plugin-updater = "2"
# Already used by the updater; here it reads Word documents (.docx).
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Already used by Tauri; here it lowers the web view's memory while hidden.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Recovery",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
hound = "3"
