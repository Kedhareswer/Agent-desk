<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Desk glow</title>
<style>
  /* A thin band of light around the screen edge while the assistant is
     listening. The window is click-through; this page only draws. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #glow {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 0.35s ease;
    box-shadow:
      inset 0 0 3px 1px rgba(150, 215, 255, 0.85),
      inset 0 0 18px 4px rgba(60, 150, 255, 0.5),
      inset 0 0 44px 8px rgba(110, 90, 255, 0.22);
  }
  #glow.on { opacity: 1; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { filter: hue-rotate(28deg) brightness(1.18); } }
  @media (prefers-reduced-motion: reduce) { #glow.on { animation: none; } }
</style>
</head>
<body>
<div id="glow"></div>
<script>
  const glow = document.getElementById("glow");
  window.__TAURI__.event.listen("glow", ({ payload }) => glow.classList.toggle("on", !!payload));
</script>
</body>
</html>
