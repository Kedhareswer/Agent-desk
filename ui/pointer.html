<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Desk pointer</title>
<style>
  /* Agent Desk's own pointer, shown while it acts so the user's cursor is
     never moved around in front of them. The window is click-through and
     its top-left corner is the arrow's tip. Nothing here animates: the
     window itself is moved. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .pointer { position: fixed; left: 0; top: 0; display: flex; align-items: flex-start; gap: 1px; }
  svg { width: 20px; height: 20px; flex: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55)); }
  .tag {
    margin-top: 13px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    font: 600 11.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #0b0c0f; background: #9fe3c4; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
<div class="pointer" aria-hidden="true">
  <svg viewBox="0 0 20 20"><path d="M0.8 0.8 L0.8 15.5 L4.9 11.9 L7.7 18.3 L10.4 17.1 L7.7 10.9 L13.2 10.9 Z" fill="#9fe3c4" stroke="#0b0c0f" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <span class="tag">Agent Desk</span>
</div>
</body>
</html>
